name: Atualizar dados

# Roda todo dia 5, de madrugada no horário de Brasília, e também pode ser
# disparado à mão pela aba Actions. Se uma fonte falhar, o script mantém o
# arquivo anterior e o aviso aparece no resumo da execução.
on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: Rscript -e 'install.packages(c("httr", "jsonlite"))'

      - name: Testar acesso ao IBGE
        continue-on-error: true
        run: |
          url="https://apisidra.ibge.gov.br/values/t/6883/n1/all/v/allxp/p/all?formato=json"
          curl -4 -sS -o /dev/null --connect-timeout 30 -w "%{http_code} %{time_total}s $url\n" "$url" || true

      - name: Censo Agropecuário 2017 (SIDRA)
        run: Rscript R/coletar_censo_agro.R

      - name: PAM, PEVS, PPM e PNAD Contínua (SIDRA)
        run: Rscript R/coletar_series.R

      - name: Organizações da Amazônia
        run: Rscript R/importar_organizacoes.R

      - name: Resumo
        if: always()
        run: |
          echo "### Situação da coleta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dados/metadados/situacao_coleta.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Gravar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Atualiza dados ($(date +%Y-%m))"
          git push
