name: Indicadores de trabalho invisível

# Coleta avulsa, só manual: baixa os insumos dos indicadores (todos, ou só as
# fontes indicadas) e recalcula os indicadores de todas as cadeias. A coleta
# mensal faz o mesmo no fim de cada rodada.
on:
  workflow_dispatch:
    inputs:
      fontes:
        description: "Fontes a coletar, separadas por espaço (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  indicadores:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: Rscript -e 'install.packages(c("httr", "jsonlite"))'

      - name: Insumos dos indicadores
        env:
          FONTES: ${{ inputs.fontes }}
        run: Rscript R/coletar_insumos_indicadores.R $FONTES

      - name: Indicadores de trabalho invisível
        run: Rscript R/indicadores_trabalho_invisivel.R

      - name: Gravar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Recalcula os indicadores de trabalho invisível"
          git pull --rebase
          git push
