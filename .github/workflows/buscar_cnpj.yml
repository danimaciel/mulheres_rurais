name: Buscar CNPJ das organizações

# Só manual. Lê a base aberta de CNPJ da Receita Federal (alguns GB) e grava
# as associações e cooperativas candidatas em dados/organizacoes/cnpj_candidatos.csv.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar na base da Receita
        run: python scripts/buscar_cnpj.py

      - name: Gravar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/organizacoes/cnpj_candidatos.csv
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Candidatos de CNPJ das organizações (base da Receita)"
          git pull --rebase
          git push
