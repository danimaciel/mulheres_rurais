name: Descrever tabelas do SIDRA

# Só manual. Grava nome, variáveis e classificações das tabelas pedidas em
# dados/metadados/descricao_sidra, para conferir códigos antes de incluir
# uma tabela na coleta. Como a página de descrição pode recusar o acesso,
# há também a opção de sondar códigos de classificação pela API de valores.
on:
  workflow_dispatch:
    inputs:
      tabelas:
        description: Números das tabelas, separados por espaço
        required: true
      faixa:
        description: Opcional. Faixa de códigos de classificação para sondar na primeira tabela (ex. 12500 12700)
        required: false
      procura:
        description: Opcional. Faixa de tabelas e classificações que devem aparecer juntas (ex. 6700 6960 c12598/all c12440/110016)
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  descrever:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: Rscript -e 'install.packages("httr")'

      - name: Descrever tabelas
        env:
          TABELAS: ${{ inputs.tabelas }}
        run: Rscript R/descrever_tabelas.R $TABELAS || true

      - name: Sondar classificações
        if: ${{ inputs.faixa != '' }}
        env:
          TABELAS: ${{ inputs.tabelas }}
          FAIXA: ${{ inputs.faixa }}
        run: Rscript R/sondar_classificacoes.R ${TABELAS%% *} $FAIXA

      - name: Procurar tabelas com um cruzamento
        if: ${{ inputs.procura != '' }}
        env:
          PROCURA: ${{ inputs.procura }}
        run: Rscript R/procurar_tabelas.R $PROCURA

      - name: Gravar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/metadados/descricao_sidra
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Descrição de tabelas do SIDRA"
          git pull --rebase
          git push
